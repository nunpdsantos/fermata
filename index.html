<!doctype html>
<!-- build 2026-11-11 (wave 3, the microphone): content change required so the
     service worker refetches this document — its precached copy carries the
     response HEADERS from fetch time, so header-only deploys (this one lets
     the page itself use the microphone: Permissions-Policy microphone=(self))
     never reach installed PWAs otherwise. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fermata-accidentals.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Fermatina — interactive music theory through your instrument. Explore scales, chords, and keys with a piano or guitar always in reach." />
    <title>Fermatina — Music theory, from the instrument out</title>
    <!-- One deployment answers on fermatina.com and on the old address
         (fermata-music.vercel.app): search engines are told which is the
         app's own. A canonical link is never fetched. -->
    <link rel="canonical" href="https://fermatina.com/" />
    <!-- The app's home opens in the visitor's own language; the pages that
         read without JavaScript (2026-11-14, scripts/pages/) are its language
         twins, and the home is their x-default. Nothing here is fetched. -->
    <link rel="alternate" hreflang="en" href="https://fermatina.com/en/" />
    <link rel="alternate" hreflang="pt" href="https://fermatina.com/pt/" />
    <link rel="alternate" hreflang="es" href="https://fermatina.com/es/" />
    <link rel="alternate" hreflang="x-default" href="https://fermatina.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fermatina" />
    <meta property="og:title" content="Fermatina — Music theory, from the instrument out" />
    <meta property="og:description" content="Fermatina — interactive music theory through your instrument. Explore scales, chords, and keys with a piano or guitar always in reach." />
    <meta property="og:url" content="https://fermatina.com/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://fermatina.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fermatina — Learn how music works, on a piano or guitar you can play right here." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fermatina — Music theory, from the instrument out" />
    <meta name="twitter:description" content="Fermatina — interactive music theory through your instrument. Explore scales, chords, and keys with a piano or guitar always in reach." />
    <meta name="twitter:image" content="https://fermatina.com/og.png" />
    <!-- Saved night theme before first paint (no light flash); "auto" follows
         the system setting. The CSP allows exactly this script by its sha256
         hash (vercel.json): ANY edit here, even whitespace, needs the new hash
         — documentShell.test.ts and `npm run check:bundle` fail until it
         matches. -->
    <script>try{var s=JSON.parse(localStorage.getItem('music-theory-app')||'null'),t=s&&s.state&&s.state.themeMode;if(t==='auto')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'fermata-night':'';if(t==='fermata-night'||t==='dark'){document.documentElement.classList.add('fermata-night');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#181208')}}catch(e){}</script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
